name: 竞彩数据每日更新

# 北京 09:00-21:00 每 30 分钟跑一次（UTC = 北京 - 8h）
on:
  schedule:
    - cron: '0,30 1-13 * * *'
  workflow_dispatch:      # 允许在 GitHub 页面手动触发
  push:
    branches: [main]

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # 需要把累积的 history.json 提交回仓库
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 抓取数据并构建页面
        run: |
          cd jc-football
          python3 fetch_daily.py
          python3 build_panel.py

      - name: 数据自检
        id: check
        run: |
          cd jc-football
          python3 selftest.py
        continue-on-error: true

      - name: 自检不通过时自动修复
        if: steps.check.outcome == 'failure'
        run: |
          cd jc-football
          python3 check_and_fix.py
          python3 build_panel.py

      # 版本号以网页为唯一真相源，APK 必须跟随。
      # 分叉会让用户无法判断手机里装的到底是不是最新版，这里卡死。
      - name: 版本一致性检查
        run: |
          cd jc-football
          python3 version_sync.py --check

      # deploy_cf.py 在缺凭据时会自动降级为「只生成 dist/ 离线包」并退出码 0，
      # 因此本步无需判断 secrets 是否为空——没配凭据也不会让定时任务变红。
      - name: 生成部署包并上传 Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd jc-football
          python3 deploy_cf.py

      # 没配凭据时把离线包留作 artifact，可手动下载后 npx wrangler 上传
      - name: 留存离线部署包
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist-offline
          path: jc-football/dist
          if-no-files-found: ignore
          retention-days: 7

      # 关键：history.json 是永久累积的历史战绩库，必须提交回仓库，
      # 否则每次 CI 都是全新环境，历史会被清零（模型统计全部失效）
      - name: 提交累积数据
        run: |
          git config user.name "jc-bot"
          git config user.email "bot@example.com"
          git add jc-football/history.json jc-football/parlay_history.json \
                  jc-football/hkmo_history.json jc-football/strongweak_history.json \
                  jc-football/half_full_history.json jc-football/matches.json \
                  jc-football/index.html 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: 每日数据更新 $(date '+%Y-%m-%d %H:%M')"
          git push
