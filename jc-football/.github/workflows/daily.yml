name: 每日自动刷新并部署

# 无人值守：每天自动抓取各数据源 → 构建 → 部署 Cloudflare Pages → 在线校验，
# 校验不通过自动重部署一次。跑在 GitHub 服务器上，不依赖任何本地机器。
#
# 注意：本仓库的项目代码在 jc-football/ 子目录下，
# GitHub Actions 只识别仓库根目录的 .github/workflows/，所以本文件必须放这里。
on:
  schedule:
    # 北京时间(UTC+8) 每天 08 / 12 / 15 / 18 / 20 / 22 点刷新
    # 对应 UTC：0 / 4 / 7 / 10 / 12 / 14
    - cron: '0 0,4,7,10,12,14 * * *'
  workflow_dispatch: {}      # 允许手动 / 由 /api/refresh 触发
  # v1.7.129：移除 push 自动触发。此前每次源码增量提交都会拉起一轮海外残缺抓取，
  # 既排队堵塞手动刷新，又有用 500.com 30 场覆盖生产 59 场的风险，只能靠人工 cancel。
  # 生产部署统一由本地（中国网络、完整历史库）全量刷新 + deploy_cf.py 负责。

permissions:
  contents: write             # 只读代码；部署用 Cloudflare token(secret)，不回写 GitHub

concurrency:
  group: daily-refresh
  cancel-in-progress: true   # v1.7.129：新触发取消排队/进行中的旧 run，避免僵尸任务串行堆积（曾排队 15 分钟）

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40     # v1.7.129：原 90 分钟会被海外慢抓取跑满强杀，配合下方墙钟收紧
    defaults:
      run:
        working-directory: jc-football   # 项目代码在子目录
    env:
      # 以下密钥在仓库 Settings → Secrets 中配置（已配好）
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      FD_API_KEY: ${{ secrets.FD_API_KEY }}
      BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      DAILY_BUDGET: "600"     # 抓取阶段预算（本地默认 480s，CI 给足）
      # v1.7.129：官方接口对海外 IP 恒定 567，fetch_daily.py 内部据此熔断，
      # 这两个墙钟再兜底，保证流水线几分钟内跑到构建+部署，不再 90 分钟超时。
      JC_FETCH_WALL_SEC: "180"    # 单进程官方接口网络总墙钟
      JC_FETCH_TIMEOUT: "300"     # fetch_daily.py 硬墙钟（timeout 命令）
      PYTHONUNBUFFERED: "1"
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装 wrangler（部署用）
        run: |
          npm install -g wrangler@4
          echo "$(npm bin -g)" >> "$GITHUB_PATH"

      - name: 安装 Python 依赖
        run: pip install -r requirements.txt

      - name: 运行每日流水线（抓取 + 构建 + 部署 + 在线校验）
        timeout-minutes: 30
        run: bash run_daily.sh deploy

      - name: 部署后在线校验（门禁）
        if: always()
        run: python3 verify_deploy.py
      - name: 回写每日数据快照（保活定时任务 + 留数据历史）
        if: always()
        continue-on-error: true
        run: |
          FILES="matches.json whoscored_data.json whoscored_recent.json whoscored_history.json \
          basketball.json basketball_ai.json basketball_ai_accuracy.json basketball_history.json \
          basketball_parlay_history.json basketball_stats.json history.json parlay_history.json \
          expert_history.json score_predict.json score_predict_accuracy.json smart_model.json \
          half_full_history.json team_crests.json fd_data.json"
          git add -f $FILES 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "数据快照无变化，跳过提交"
          else
            TS=$(TZ=Asia/Shanghai date '+%F %H:%M')
            git -c user.name="jc-bot" -c user.email="jc-bot@users.noreply.github.com" \
              commit -m "chore(data): 每日数据快照 $TS [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "已回写数据快照"
          fi
